# Cloudflare Pages config for Saturnator (static Nuxt + Pages Functions).
# The Nuxt site is STILL statically generated (`nuxt generate` -> .output/public).
# Server logic lives ONLY in Pages Functions under ./functions (Hono, /api/x402/*).
name = "saturnator"
pages_build_output_dir = ".output/public"
compatibility_date = "2024-11-01"
# nodejs_compat is required: @x402/* + @solana web3 use Buffer/crypto/node builtins.
compatibility_flags = ["nodejs_compat"]

# Non-secret x402 runtime config exposed to the Pages Function via `env`.
# Secrets (e.g. STRAPI_API_TOKEN) must be set with `wrangler pages secret put`,
# never committed here.
[vars]
X402_ENABLED = "true"
X402_NETWORK = "solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1"
X402_FACILITATOR_URL = "https://x402.org/facilitator"
# Devnet test receiver (public wallet address; NOT a secret). Used ONLY by
# the /health smoke test — real license/sponsorship payTo is always resolved
# dynamically from the artist's verified payout wallet (see Task 2.3).
X402_DEFAULT_RECEIVER = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
# Phase 2 additions (Task 2.1):
X402_LICENSE_MIN_USD = "0.01"
X402_SPOTLIGHT_PRICE_USD = "0.10"
X402_SPOTLIGHT_WINDOW_HOURS = "24"
X402_SIGNED_DOWNLOAD_TTL_SECONDS = "60"
# STRAPI_URL and STRAPI_API_TOKEN are secrets (never committed here):
#   local dev  -> .dev.vars (gitignored; see .dev.vars.example)
#   deployed   -> `wrangler pages secret put STRAPI_URL` / `STRAPI_API_TOKEN`
